name: Build React and Push to Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Stáhnutí zdrojového kódu z GitHubu
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Nastavení Node.js prostředí
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 2b. Nastavení environment proměnné VITE_APP_VERSION z package.json
      - name: Set VITE_APP_VERSION from package.json
        run: |
          echo "VITE_APP_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
          echo "VITE_GIT_COMMIT=${{ github.sha }}" >> $GITHUB_ENV
          echo "VITE_BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      # 3. Instalace závislostí a build React aplikace do složky dist/
      - name: Install dependencies and build React app
        run: |
          npm ci
          npm run build
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_GIT_COMMIT: ${{ env.VITE_GIT_COMMIT }}
          VITE_BUILD_DATE: ${{ env.VITE_BUILD_DATE }}

      # 4. Přihlášení k Docker Hubu
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Dynamická extrakce metadat a tagů
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shoppinglistappimage
          tags: |
            # Pokud push obsahuje Git tag (např. v1.0.0), použije se jako verze
            type=semver,pattern={{version}}
            # Pokud push NENÍ Git tag, vytvoří se short SHA (např. sha-2f08af3)
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            # Tag 'latest' se přidá vždy
            type=raw,value=latest

      # 6. Build a push do Docker Hubu
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 7. Nasazení nové verze na netcup server přes SSH
      - name: Deploy to Netcup VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Stažení nové verze image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/shoppinglistappimage:latest

            # 2. Zastavení a smazání starého kontejneru (pokud existuje a běží)
            docker stop shopping-app || true
            docker rm shopping-app || true

            # 3. Spuštění nového kontejneru
            docker run -d \
              --name shopping-app \
              --restart always \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/shoppinglistappimage:latest

            # 4. Úklid starých/nepoužívaných vrstev image ze serveru
            docker image prune -f
