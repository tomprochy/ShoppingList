name: Manual Run with Summary

on:
  workflow_dispatch:

jobs:
  build-and-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Node version before setup
        run: |
          echo "## Node version before setup" >> $GITHUB_STEP_SUMMARY
          node --version >> $GITHUB_STEP_SUMMARY

      - name: Current date
        run: |
          echo "## Current date" >> $GITHUB_STEP_SUMMARY
          date >> $GITHUB_STEP_SUMMARY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node version after setup
        run: |
          echo "## Node version after setup" >> $GITHUB_STEP_SUMMARY
          node --version >> $GITHUB_STEP_SUMMARY
