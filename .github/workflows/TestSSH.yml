name: SSH Connect via Key

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ssh-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Připojení přes SSH pomocí klíče
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Úspěšně připojeno přes SSH klíč!"
            docker ps
