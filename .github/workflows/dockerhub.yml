name: Build React and Push to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Stáhnutí zdrojového kódu z GitHubu
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Nastavení Node.js prostředí
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Instalace závislostí a build React aplikace do složky dist/
      - name: Install dependencies and build React app
        run: |
          npm ci
          npm run build

      # 4. Přihlášení k Docker Hubu
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Extrakce metadat (tagy jako 'latest' a SHA hash)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shoppinglistappimage
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 6. Build Docker image a nahrání (Push) do Docker Hubu
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
