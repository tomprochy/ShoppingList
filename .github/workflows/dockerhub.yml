name: Build React and Push to Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Stáhnutí zdrojového kódu z GitHubu
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Nastavení Node.js prostředí
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 2b. Nastavení environment proměnné VITE_APP_VERSION z package.json
      - name: Set VITE_APP_VERSION from package.json
        run: echo "VITE_APP_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      # 3. Instalace závislostí a build React aplikace do složky dist/
      - name: Install dependencies and build React app
        run: |
          npm ci
          npm run build

      # 4. Přihlášení k Docker Hubu
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Dynamická extrakce metadat a tagů
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shoppinglistappimage
          tags: |
            # Pokud push obsahuje Git tag (např. v1.0.0), použije se jako verze
            type=semver,pattern={{version}}
            # Pokud push NENÍ Git tag, vytvoří se short SHA (např. sha-2f08af3)
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            # Tag 'latest' se přidá vždy
            type=raw,value=latest

      # 6. Build a push do Docker Hubu
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}